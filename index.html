<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <!-- CREDITS
        Thanks to my biggest supporter and fellow Concorde lover, they will recognize themselves.
        Many many thanks to Captainhoers for creating such adorable ponies, universes and fun games.
        -->
        <meta charset="utf-8">
        <title>Hoersverse</title>
        <link href="src/style.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <div class="app-grid">
            <div class="app-icon" style="grid-column: 1; grid-row: 1;" data-url="https://askfirestarterspitfire.tumblr.com/">
                <img class="app-img" src="src/tumblr.png">
                <p class="app-name">Crash & Burn Blog</p>
            </div>
            <div class="app-icon" style="grid-column: 2; grid-row: 1;" data-url="AllOfFirestarter/act7.html">
                <img class="app-img" src="src/spitfire.jpg">
                <p class="app-name">All of Firestarter Act 7</p>
            </div>
            <div class="app-icon" style="grid-column: 1; grid-row: 2;" data-url="https://askthesunjackers.tumblr.com/">
                <img class="app-img" src="src/tumblr.png">
                <p class="app-name">Sunjackers Blog</p>
            </div>
            <div class="app-icon" style="grid-column: 2; grid-row: 2;" data-url="AllOfSunjackers/Volume1/">
                <img class="app-img" src="src/sunjackers 1.jpg">
                <p class="app-name">All of the Sunjackers Vol 1</p>
            </div>
            <div class="app-icon" style="grid-column: 3; grid-row: 2;" data-url="AllOfSunjackers/Volume2/">
                <img class="app-img" src="src/sunjackers 2.jpg">
                <p class="app-name">All of the Sunjackers Vol 2</p>
            </div>
            <div class="app-icon" style="grid-column: 4; grid-row: 2;" data-url="AllOfSunjackers/Volume3/">
                <img class="app-img" src="src/sunjackers 3.jpg">
                <p class="app-name">All of the Sunjackers Vol 3</p>
            </div>
            <div class="app-icon" style="grid-column: 1; grid-row: 3;" data-url="https://stardustinternational.tumblr.com/">
                <img class="app-img" src="src/tumblr.png">
                <p class="app-name">Stardust Blog</p>
            </div>
            <div class="app-icon" style="grid-column: 2; grid-row: 3;" data-url="AllOfStardust/">
                <img class="app-img" src="src/stardust.png">
                <p class="app-name">All of Stardust</p>
            </div>
            <div class="app-icon" style="grid-column: 1; grid-row: 7;" data-url="Concordopedia/">
                <img class="app-img" src="src/connie.png">
                <p class="app-name">Concordopedia</p>
            </div>
            <div class="app-icon" style="grid-column: 2; grid-row: 7;" data-url="Kwikepedia/wiki/Concorde_(astronaut)/">
                <img class="app-img" src="src/kwikepedia.png">
                <p class="app-name">Kwikepedia</p>
            </div>
            <div class="app-icon" style="grid-column: 3; grid-row: 7;" data-url="NewTimeline/">
                <img class="app-img" src="src/timeline.png">
                <p class="app-name">Timeline</p>
            </div>
            <div class="app-icon" style="grid-column: 4; grid-row: 7;" data-url="SmashAndNoPass/">
                <img class="app-img" src="src/smash.png">
                <p class="app-name">Smash or Smash</p>
            </div>
            <div class="app-icon" style="grid-column: 5; grid-row: 7;" data-url="Charadex/">
                <img class="app-img" src="src/young_connie.png">
                <p class="app-name">Charadex</p>
            </div>
            <div class="app-icon" style="grid-column: -1; grid-row: 7;" data-url="https://linktr.ee/CaptainHoers">
                <img class="app-img" src="src/linktree.png">
                <p class="app-name">Captainhoers' Linktree</p>
            </div>
        </div>

        <div class="task-bar">
            <button class="start-menu-btn">start</button>
            <div class="bottom-left-panel">
                <img class="tray-icon" src="src/sound.png">
                <time id="clock"></time>
            </div>
        </div>
    </body>
    <script src="src/script.js"></script>
</html>
